name: Refresh official Canadian notices

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_official_feeds.py'
      - '.github/workflows/refresh-notices.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-notices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official sources
        run: python scripts/fetch_official_feeds.py
      - name: Commit refreshed notices only if changed
        run: |
          git config user.name "swipes-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/notices.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official Canadian notices"
            git push
          fi
